name: tobitube
description: Aplikasi streaming musik video YouTube bergaya Spotify dengan kurasi playlist AI.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Background audio
  just_audio: ^0.9.40
  youtube_explode_dart: ^3.1.0

  # State Management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.4

  # Navigation
  go_router: ^13.2.0

  # YouTube Player (official iframe embed wrapper)
  youtube_player_flutter: ^9.1.1

  # Database
  sqflite: ^2.3.2
  path: ^1.9.0

  # Offline / Download
  path_provider: ^2.1.3
  dio: ^5.4.3
  connectivity_plus: ^6.0.5

  # HTTP / API
  http: ^1.2.1

  # UI / Typography
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1

  # Drag & Drop Reorder
  flutter_reorderable_list: ^1.0.1

  # Shared Preferences (settings)
  shared_preferences: ^2.2.3

  # UUID generation
  uuid: ^4.4.0

  # Marquee (scrolling text)
  marquee: ^2.2.3

  # Animations
  lottie: ^3.1.2

  # Icons
  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.2
  permission_handler: ^12.0.3
  audio_service: ^0.18.19
  flutter_downloader: ^1.12.0
  video_player: ^2.13.0
  chewie: ^1.14.1
  miniplayer: ^1.0.1
  flutter_inappwebview: ^6.1.5
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.3.9
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/Tobitube.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/images/Tobitube.png"

flutter_native_splash:
  # Hanya background gelap — tidak ada gambar, tidak ada logo tumpuk
  color: "#0A0A0F"
  android_12:
    color: "#0A0A0F"
    # Tidak menampilkan icon apapun di splash
    icon_background_color: "#0A0A0F"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
